<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SprintHelm — Sprint Helm (motion)</title>
  <defs>
    <linearGradient id="tileS" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#8b93fb"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="markS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="trailS" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="trailS2" x1="1" y1="1" x2="0" y2="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="sheenS" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="helmS" fill="none">
      <!-- 4 handles in an X — the sprint stance -->
      <g stroke-width="16" stroke-linecap="round">
        <line x1="128" y1="38" x2="128" y2="64" transform="rotate(45 128 128)"/>
        <line x1="128" y1="38" x2="128" y2="64" transform="rotate(135 128 128)"/>
        <line x1="128" y1="38" x2="128" y2="64" transform="rotate(225 128 128)"/>
        <line x1="128" y1="38" x2="128" y2="64" transform="rotate(315 128 128)"/>
      </g>
      <!-- rim -->
      <circle cx="128" cy="128" r="58" stroke-width="15"/>
      <!-- 4 spokes -->
      <g stroke-width="12">
        <line x1="128" y1="78" x2="128" y2="112" transform="rotate(45 128 128)"/>
        <line x1="128" y1="78" x2="128" y2="112" transform="rotate(135 128 128)"/>
        <line x1="128" y1="78" x2="128" y2="112" transform="rotate(225 128 128)"/>
        <line x1="128" y1="78" x2="128" y2="112" transform="rotate(315 128 128)"/>
      </g>
    </g>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tileS)"/>
  <!-- 3D extrusion -->
  <use href="#helmS" transform="translate(0 5)" stroke="#78350f" opacity="0.55"/>
  <circle cx="128" cy="133" r="23" fill="#78350f" opacity="0.55"/>
  <!-- mark -->
  <use href="#helmS" stroke="url(#markS)"/>
  <circle cx="128" cy="128" r="23" fill="url(#markS)"/>
  <circle cx="128" cy="128" r="9" fill="#585ceb"/>
  <!-- motion trails: the wheel is spinning — sprint velocity -->
  <path d="M 113.4 45.3 A 84 84 0 0 1 206.9 99.3" fill="none"
        stroke="url(#trailS)" stroke-width="11" stroke-linecap="round"/>
  <path d="M 142.6 210.7 A 84 84 0 0 1 86.0 200.7" fill="none"
        stroke="url(#trailS2)" stroke-width="9" stroke-linecap="round"/>
  <!-- sheen -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheenS)"/>
</svg>
